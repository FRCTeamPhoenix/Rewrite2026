name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    container: wpilib/systemcore-cross-ubuntu:2027-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile and run tests on robot code
        run: ./gradlew build
  spotless:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Test token
        env:
          T: ${{ secrets.BOT2342 }}
        run: |
          echo "token length: ${#T}"
          curl -s -o /dev/null -w "repo api: %{http_code}\n" \
            -H "Authorization: Bearer $T" \
            https://api.github.com/repos/${{ github.repository }}
          curl -s -H "Authorization: Bearer $T" https://api.github.com/user | grep '"login"'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - run: chmod +x gradlew
      - run: ./gradlew :spotlessApply
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
            commit_user_name: Phoenix2342-Bot
            commit_author: Phoenix2342-Bot <github@team2342.org>
            commit_message: Auto-format code
